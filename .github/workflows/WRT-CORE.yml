# SPDX-License-Identifier: MIT
# H5000M 云编译公用核心

name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  WRT_CONFIG: ${{ inputs.WRT_CONFIG }}
  WRT_THEME: ${{ inputs.WRT_THEME }}
  WRT_NAME: ${{ inputs.WRT_NAME }}
  WRT_SSID: ${{ inputs.WRT_SSID }}
  WRT_WORD: ${{ inputs.WRT_WORD }}
  WRT_IP: ${{ inputs.WRT_IP }}
  WRT_PW: ${{ inputs.WRT_PW }}
  WRT_REPO: ${{ inputs.WRT_REPO }}
  WRT_BRANCH: ${{ inputs.WRT_BRANCH }}
  WRT_SOURCE: ${{ inputs.WRT_SOURCE }}
  WRT_PACKAGE: ${{ inputs.WRT_PACKAGE }}
  WRT_TEST: ${{ inputs.WRT_TEST }}

jobs:
  core:
    name: ${{ inputs.WRT_SOURCE }}
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout Projects
        uses: actions/checkout@main

      # ============================================================
      # 初始化编译环境
      # ============================================================
      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox || true
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean

          sudo -E apt -yqq install dos2unix libfuse-dev

          sudo bash -c \
            'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt

          rm -f "$GITHUB_WORKSPACE/wrt"
          sudo ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"

      # ============================================================
      # 初始化变量
      # ============================================================
      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> "$GITHUB_ENV"
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> "$GITHUB_ENV"
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> "$GITHUB_ENV"

          echo "WRT_TARGET=$(grep -m1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> "$GITHUB_ENV"

          echo "WRT_WIFI=wifi-yes" >> "$GITHUB_ENV"
          echo "WRT_KVER=none" >> "$GITHUB_ENV"
          echo "WRT_LIST=none" >> "$GITHUB_ENV"

      # ============================================================
      # Clone 237 源码
      # ============================================================
      - name: Clone Code
        run: |
          git clone \
            --depth=1 \
            --single-branch \
            --branch "$WRT_BRANCH" \
            "$WRT_REPO" \
            ./wrt/

          cd ./wrt/

          echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> "$GITHUB_ENV"

          # GitHub Actions 移除国内下载镜像
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"

          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      # ============================================================
      # 脚本换行与执行权限
      # ============================================================
      - name: Check Scripts
        run: |
          find ./ \
            -maxdepth 3 \
            -type f \
            -iregex ".*\(txt\|sh\)$" \
            -exec dos2unix {} \; \
            -exec chmod +x {} \;

      # ============================================================
      # Cache
      # ============================================================
      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@main
        with:
          key: ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}-${{ env.WRT_HASH }}
          restore-keys: ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then

            find "./wrt/staging_dir" \
              -type d \
              -name "stamp" \
              -not -path "*target*" |
            while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp
            echo "1" > ./wrt/tmp/.build

            echo "toolchain cache ready"

          else

            echo "caches missed"

          fi

      # ============================================================
      # Feeds
      # ============================================================
      - name: Update Feeds
        run: |
          set -e

          cd ./wrt/

          # --------------------------------------------------------
          # 自定义 feeds
          #
          # QModem：
          # 只需要它提供：
          #   ubus-at-daemon
          #   sms-tool_q
          #
          # 不需要 luci-app-qmodem / qmodem-next / tom_modem
          # --------------------------------------------------------

          echo "" >> feeds.conf.default

          cat >> feeds.conf.default <<'EOF'
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages;main
          src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall;main
          src-git mosdns https://github.com/sbwml/luci-app-mosdns;v5
          src-git helloworld https://github.com/fw876/helloworld
          src-git openclash https://github.com/vernesong/OpenClash;master
          src-git istore https://github.com/linkease/istore;main
          src-git qmodem https://github.com/FUjr/QModem;main
          src-git mt5700m https://github.com/FAN789/luci-app-mt5700m;main
          EOF

          echo "===== feeds.conf.default ====="
          cat feeds.conf.default
          echo "=============================="

          ./scripts/feeds update -a

          # --------------------------------------------------------
          # Go 1.26.x
          # --------------------------------------------------------

          rm -rf ./feeds/packages/lang/golang

          git clone \
            --depth=1 \
            --single-branch \
            --branch 26.x \
            https://github.com/sbwml/packages_lang_golang \
            ./feeds/packages/lang/golang

          echo "===== Go Version ====="

          GO_MM=$(
            grep -m1 \
              -oP '^GO_VERSION_MAJOR_MINOR:=\K.*' \
              ./feeds/packages/lang/golang/golang/Makefile || true
          )

          GO_PATCH=$(
            grep -m1 \
              -oP '^GO_VERSION_PATCH:=\K.*' \
              ./feeds/packages/lang/golang/golang/Makefile || true
          )

          echo "${GO_MM}.${GO_PATCH}"

          # --------------------------------------------------------
          # 删除 ImmortalWrt 自带的冲突旧包
          # --------------------------------------------------------

          rm -rf ./feeds/luci/applications/luci-app-openclash
          rm -rf ./feeds/luci/applications/luci-app-passwall
          rm -rf ./feeds/luci/applications/luci-app-passwall2
          rm -rf ./feeds/luci/applications/luci-app-mosdns
          rm -rf ./feeds/luci/applications/luci-app-ssr-plus

          for P in \
            xray-core \
            xray-plugin \
            sing-box \
            hysteria \
            naiveproxy \
            shadowsocks-rust \
            simple-obfs \
            shadow-tls \
            v2ray-plugin \
            v2ray-core \
            v2ray-geodata \
            ipt2socks \
            chinadns-ng \
            dns2socks \
            dnsproxy \
            geoview \
            microsocks \
            tcping \
            mosdns \
            redsocks2 \
            tuic-client
          do
            rm -rf "./feeds/packages/net/$P"
          done

          # 重建 feed 索引
          ./scripts/feeds update -i

          # --------------------------------------------------------
          # 先正常安装全部 feeds
          # --------------------------------------------------------

          ./scripts/feeds install -a

          # ========================================================
          # 关键修改 1：
          # 删除 QModem 安装出来的全部 package 链接
          # 然后只重新安装 MT5700M 真正需要的两个后端
          # ========================================================

          echo
          echo "========================================"
          echo " 精简 QModem"
          echo "========================================"

          rm -rf ./package/feeds/qmodem
          mkdir -p ./package/feeds/qmodem

          ./scripts/feeds install -p qmodem \
            ubus-at-daemon \
            sms-tool_q

          # 清掉其它 feed 可能留下的断链
          find ./package/feeds/ \
            -xtype l \
            -exec rm -f {} + \
            2>/dev/null || true

          echo
          echo "===== QModem 最终链接 ====="

          find ./package/feeds/qmodem \
            -mindepth 1 \
            -maxdepth 1 \
            -printf '%f -> %l\n' \
            2>/dev/null || true

          echo "============================"

          # QModem 目录最终只允许 2 个链接
          QMODEM_COUNT=$(
            find ./package/feeds/qmodem \
              -mindepth 1 \
              -maxdepth 1 \
              | wc -l
          )

          if [ "$QMODEM_COUNT" -ne 2 ]; then
            echo "::error::QModem 最终不是两个 package，实际数量：$QMODEM_COUNT"
            exit 1
          fi

          # ubus-at-daemon 的源码目录实际名称可能使用下划线
          if ! find ./package/feeds/qmodem \
            -mindepth 1 \
            -maxdepth 1 \
            \( -name 'ubus_at_daemon' -o -name 'ubus-at-daemon' \) \
            | grep -q .
          then
            echo "::error::没有找到 ubus-at-daemon"
            exit 1
          fi

          if ! find ./package/feeds/qmodem \
            -mindepth 1 \
            -maxdepth 1 \
            -name 'sms-tool_q' \
            | grep -q .
          then
            echo "::error::没有找到 sms-tool_q"
            exit 1
          fi

          echo "[ OK ] QModem 只保留 ubus-at-daemon + sms-tool_q"

          # --------------------------------------------------------
          # 打印关键组件来源
          # --------------------------------------------------------

          set +e

          echo
          echo "===== 关键组件来源核对 ====="

          printf "%-24s %-22s %s\n" \
            "包名" \
            "来源feed" \
            "版本"

          for PKG in \
            xray-core \
            xray-plugin \
            sing-box \
            hysteria \
            naiveproxy \
            shadowsocks-rust \
            shadowsocksr-libev \
            simple-obfs \
            shadow-tls \
            v2ray-plugin \
            v2ray-geodata \
            ipt2socks \
            chinadns-ng \
            dns2socks \
            dns2socks-rust \
            dnsproxy \
            geoview \
            microsocks \
            tcping \
            mosdns \
            redsocks2 \
            tuic-client \
            trojan \
            kcptun \
            haproxy \
            luci-app-passwall \
            luci-app-ssr-plus \
            luci-app-openclash \
            luci-app-mosdns \
            luci-app-store
          do

            LINK=$(
              find ./package/feeds/ \
                -maxdepth 2 \
                -name "$PKG" \
                -print \
                -quit \
                2>/dev/null
            )

            if [ -n "$LINK" ]; then

              FEED=$(basename "$(dirname "$LINK")")
              MK="$(readlink -f "$LINK")/Makefile"

              VER=$(
                grep -m1 \
                  -oP '^PKG_VERSION:=\K.*' \
                  "$MK" \
                  2>/dev/null
              )

              [ -n "$VER" ] ||
              VER=$(
                grep -m1 \
                  -oP '^PKG_SOURCE_DATE:=\K.*' \
                  "$MK" \
                  2>/dev/null
              )

              [ -n "$VER" ] ||
              VER=$(
                grep -m1 \
                  -oP '^PKG_SOURCE_VERSION:=\K.{0,12}' \
                  "$MK" \
                  2>/dev/null
              )

              printf "%-24s %-22s %s\n" \
                "$PKG" \
                "$FEED" \
                "${VER:-?}"

            else

              printf "%-24s %-22s %s\n" \
                "$PKG" \
                "未安装" \
                "-"

            fi

          done

          echo "==========================="

          set -e

      # ============================================================
      # 自定义插件
      # ============================================================
      - name: Custom Packages
        run: |
          cd ./wrt/package/

          "$GITHUB_WORKSPACE/Scripts/Packages.sh"
          "$GITHUB_WORKSPACE/Scripts/Handles.sh"

      # ============================================================
      # 自定义 files
      # ============================================================
      - name: Custom Files
        run: |
          if [ -d "$GITHUB_WORKSPACE/Files" ]; then

            mkdir -p ./wrt/files
            cp -rf "$GITHUB_WORKSPACE/Files/." ./wrt/files/

            # 只处理脚本文件，避免损坏二进制
            find ./wrt/files/etc/uci-defaults/ \
              -type f \
              -exec dos2unix {} \; \
              2>/dev/null || true

            find ./wrt/files/etc/uci-defaults/ \
              -type f \
              -exec chmod +x {} \; \
              2>/dev/null || true

            chmod 755 \
              ./wrt/files/etc/openclash/core/clash_meta \
              2>/dev/null || true

            echo "===== files ====="
            find ./wrt/files/ -type f
            echo "================="

          fi

      # ============================================================
      # .config
      # ============================================================
      - name: Custom Settings
        run: |
          set -e

          cd ./wrt/

          # --------------------------------------------------------
          # 237 H5000M MT7992 默认配置
          # --------------------------------------------------------

          WRT_BASE="./defconfig/mt7987_mt7992.config"

          if [ -f "$WRT_BASE" ]; then

            cp -f "$WRT_BASE" .config

            echo "base config: $WRT_BASE ($(grep -c . "$WRT_BASE") 行)"

          else

            echo "::error::没有找到 $WRT_BASE"
            exit 1

          fi

          # --------------------------------------------------------
          # 叠加我们的个人配置
          # --------------------------------------------------------

          cat "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" >> .config

          "$GITHUB_WORKSPACE/Scripts/Settings.sh"

          # ========================================================
          # 清掉 QModem 主包与所有残留子配置
          # ========================================================

          sed -i \
            -e '/^CONFIG_PACKAGE_luci-app-qmodem=/d' \
            -e '/^# CONFIG_PACKAGE_luci-app-qmodem is not set$/d' \
            -e '/^CONFIG_PACKAGE_luci-app-qmodem_/d' \
            -e '/^# CONFIG_PACKAGE_luci-app-qmodem_/d' \
            -e '/^CONFIG_PACKAGE_luci-app-qmodem-next=/d' \
            -e '/^# CONFIG_PACKAGE_luci-app-qmodem-next is not set$/d' \
            -e '/^CONFIG_PACKAGE_tom_modem=/d' \
            -e '/^# CONFIG_PACKAGE_tom_modem is not set$/d' \
            -e '/^CONFIG_PACKAGE_tom_modem_/d' \
            -e '/^# CONFIG_PACKAGE_tom_modem_/d' \
            .config

          echo '# CONFIG_PACKAGE_luci-app-qmodem is not set' >> .config
          echo '# CONFIG_PACKAGE_luci-app-qmodem-next is not set' >> .config
          echo '# CONFIG_PACKAGE_tom_modem is not set' >> .config

          # ========================================================
          # Discussion #433：
          # blkid 必须最后强制设为 y
          # 否则 make defconfig 会洗掉闭源 MT7992 WiFi
          # ========================================================

          sed -i \
            '/^CONFIG_PACKAGE_blkid=/d;
             /^# CONFIG_PACKAGE_blkid is not set$/d' \
            .config

          echo 'CONFIG_PACKAGE_blkid=y' >> .config

          # --------------------------------------------------------
          # 生成最终配置
          # --------------------------------------------------------

          make defconfig -j"$(nproc)"

      # ============================================================
      # 编译前配置终检
      # ============================================================
      - name: Check H5000M Config
        run: |
          cd ./wrt/

          WRT_MISS=0

          wrt_need() {

            if grep -Fqx "$1" .config; then

              printf " [ OK ] %s\n" "$1"

            else

              printf " [FAIL] %s\n" "$1"

              KEY="${1%%=*}"

              grep -m1 -F "$KEY" .config || true

              WRT_MISS=$((WRT_MISS + 1))

            fi
          }

          echo
          echo "========================================"
          echo " H5000M 最终配置检查"
          echo "========================================"

          # --------------------------------------------------------
          # 机型
          # --------------------------------------------------------

          echo
          echo "===== DEVICE ====="

          wrt_need \
            "CONFIG_TARGET_mediatek_filogic_DEVICE_hiveton-h5000m=y"

          # --------------------------------------------------------
          # Discussion #433 / 闭源 WiFi
          # --------------------------------------------------------

          echo
          echo "===== MT7992 WIFI ====="

          wrt_need "CONFIG_PACKAGE_blkid=y"

          for K in \
            kmod-mt_wifi7 \
            kmod-mt_wifi_cmn \
            kmod-mt_hwifi \
            kmod-mtk_pci \
            kmod-mt7992 \
            kmod-mt799a \
            kmod-connac_if \
            kmod-warp \
            kmod-mtk_wed
          do
            wrt_need "CONFIG_PACKAGE_$K=y"
          done

          wrt_need "CONFIG_MTK_WIFI7_FIRST_IF_MT7992=y"
          wrt_need "CONFIG_MTK_WIFI7_SECOND_IF_MT7992=y"
          wrt_need "CONFIG_MTK_WIFI7_MT_WIFI=m"

          wrt_need "CONFIG_MTK_WIFI7_FIRST_IF_EEPROM_FLASH=y"
          wrt_need "CONFIG_MTK_WIFI7_FIRST_IF_IPAILNA=y"
          wrt_need "CONFIG_MTK_WIFI7_SECOND_IF_IPAILNA=y"

          wrt_need 'CONFIG_MTK_WIFI7_SKU_TYPE="BE5040"'

          wrt_need "CONFIG_MTK_HWIFI_MT7992=y"
          wrt_need "CONFIG_MTK_HWIFI_MT799A=y"

          # ========================================================
          # 关键：
          # 我们本地验证成功的是 4 / 0 / 0
          # ========================================================

          wrt_need "CONFIG_MTK_HWIFI_MT7992_RRO_MODE=4"
          wrt_need "CONFIG_MTK_HWIFI_MT7992_OPTION_TYPE=0"
          wrt_need "CONFIG_MTK_HWIFI_MT7992_INTR_OPTION_SET=0"

          # --------------------------------------------------------
          # MT5700M
          # --------------------------------------------------------

          echo
          echo "===== MT5700M ====="

          wrt_need "CONFIG_PACKAGE_luci-app-mt5700m=y"
          wrt_need "CONFIG_PACKAGE_ubus-at-daemon=y"
          wrt_need "CONFIG_PACKAGE_sms-tool_q=y"

          wrt_need "CONFIG_PACKAGE_kmod-usb-net=y"
          wrt_need "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y"
          wrt_need "CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y"
          wrt_need "CONFIG_PACKAGE_kmod-usb-serial=y"
          wrt_need "CONFIG_PACKAGE_kmod-usb-serial-option=y"

          # --------------------------------------------------------
          # FAN789 风扇
          # --------------------------------------------------------

          echo
          echo "===== FAN CONTROL ====="

          wrt_need "CONFIG_PACKAGE_luci-app-h5000m-fancontrol=y"
          wrt_need "CONFIG_PACKAGE_kmod-hwmon-pwmfan=y"

          # --------------------------------------------------------
          # 其它个人插件
          # --------------------------------------------------------

          echo
          echo "===== PLUGINS ====="

          for P in \
            luci-app-passwall \
            luci-app-ssr-plus \
            luci-app-openclash \
            luci-app-mosdns \
            luci-app-mtwifi-cfg \
            luci-app-store \
            luci-theme-argon
          do
            wrt_need "CONFIG_PACKAGE_$P=y"
          done

          # ========================================================
          # QModem 不允许出现任何启用项
          # ========================================================

          echo
          echo "===== QMODEM CLEAN CHECK ====="

          QMODEM_ACTIVE=$(
            grep -E \
              '^CONFIG_PACKAGE_(luci-app-qmodem|luci-app-qmodem-next|tom_modem).*=[ym]$' \
              .config || true
          )

          if [ -n "$QMODEM_ACTIVE" ]; then

            echo "[FAIL] 发现不应该启用的 QModem 项："
            echo "$QMODEM_ACTIVE"

            WRT_MISS=$((WRT_MISS + 1))

          else

            echo "[ OK ] QModem LuCI / tom_modem 没有启用"

          fi

          # --------------------------------------------------------
          # 结果
          # --------------------------------------------------------

          echo
          echo "========================================"

          if [ "$WRT_MISS" -gt 0 ]; then

            echo "::error::最终配置有 $WRT_MISS 项异常"

            if [ "$WRT_TEST" = "true" ]; then

              echo "TEST 模式：不终止，上传配置供检查"

            else

              exit 1

            fi

          else

            echo "[ OK ] H5000M 配置检查全部通过"

          fi

      # ============================================================
      # 清理 build_dir
      # ============================================================
      - name: Clean Build Dir
        run: |
          cd ./wrt/
          make clean -j"$(nproc)"

      # ============================================================
      # 下载源码包
      # ============================================================
      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          timeout 1500 \
            make download -j"$(nproc)" ||
            make download -j1 V=s

          echo "===== dl ====="
          du -sh ./dl

          # 删除异常小文件
          find ./dl \
            -size -1024c \
            -type f \
            -exec ls -l {} \; \
            -exec rm -f {} \;

          echo "=============="

      # ============================================================
      # 正式编译
      # ============================================================
      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make -j"$(nproc)" ||
          make -j"$(nproc)" V=s ||
          make -j1 V=s

      # ============================================================
      # 关键修改 2：
      #
      # 编译完成以后检查 5 个闭源 WiFi 核心 ko
      #
      # 必须已经进入 root-mediatek/lib/modules/
      #
      # 少任何一个：
      #   exit 1
      #
      # 后面的 Package / Release 都不会执行
      # ============================================================
      - name: Check MT7992 Kernel Modules
        if: env.WRT_TEST != 'true'
        run: |
          set -e

          cd ./wrt/

          echo
          echo "========================================"
          echo " MT7992 编译后无线驱动终检"
          echo "========================================"

          WIFI_MISS=0

          for KO in \
            mt_wifi.ko \
            mtk_pci.ko \
            mtk_hwifi.ko \
            mt7992.ko \
            mt799a.ko
          do

            KO_PATH=$(
              find ./build_dir \
                -type f \
                -path '*/root-mediatek/lib/modules/*' \
                -name "$KO" \
                -print \
                -quit
            )

            if [ -n "$KO_PATH" ]; then

              echo "[ OK ] $KO"
              echo "       $KO_PATH"

            else

              echo "[FAIL] $KO 没有进入 H5000M rootfs"

              WIFI_MISS=$((WIFI_MISS + 1))

            fi

          done

          echo
          echo "========================================"

          if [ "$WIFI_MISS" -ne 0 ]; then

            echo "::error::缺少 $WIFI_MISS 个 MT7992 核心无线模块"
            echo "::error::停止流程，不允许打包和发布固件"

            exit 1

          fi

          echo "[ OK ] mt_wifi.ko"
          echo "[ OK ] mtk_pci.ko"
          echo "[ OK ] mtk_hwifi.ko"
          echo "[ OK ] mt7992.ko"
          echo "[ OK ] mt799a.ko"

          echo
          echo "[ OK ] 5 个 MT7992 核心驱动全部进入 rootfs"
          echo "[ OK ] 允许继续打包与发布"

      # ============================================================
      # Cache cleanup
      # ============================================================
      - name: Cleanup Caches
        if: success() && env.WRT_TEST != 'true' && steps.check-cache.outputs.cache-hit != 'true'
        run: |
          CACHE_LIST=$(
            gh cache list \
              --key "$WRT_CONFIG-$WRT_INFO" \
              | cut -f1
          )

          for CACHE_KEY in $CACHE_LIST; do
            gh cache delete "$CACHE_KEY"
          done

          echo "caches cleanup done"

      # ============================================================
      # Runner 信息
      # ============================================================
      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread" || true

          echo "======================="
          df -h

          echo "======================="
          du -h --max-depth=1

          echo "======================="

      # ============================================================
      # 固件整理
      # ============================================================
      - name: Package Firmware
        run: |
          cd ./wrt/

          mkdir -p ./upload/

          cp -f \
            ./.config \
            ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [ "$WRT_TEST" != "true" ]; then

            WRT_KVER_VALUE=$(
              find ./bin/targets/ \
                -type f \
                -name "*.manifest" \
                -exec grep -oP '^kernel - \K[\d\.]+' {} \; \
                | sort -u \
                | head -n1
            )

            echo "WRT_KVER=${WRT_KVER_VALUE:-unknown}" >> "$GITHUB_ENV"

            WRT_LIST_VALUE=$(
              find ./bin/targets/ \
                -type f \
                -name "*.manifest" \
                -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; \
                | tr '\n' ' '
            )

            echo "WRT_LIST=$WRT_LIST_VALUE" >> "$GITHUB_ENV"

            find ./bin/targets/ \
              -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" \
              -exec rm -rf {} +

            while IFS= read -r FILE
            do

              EXT="$(basename "$FILE" | cut -d '.' -f2-)"

              NAME=$(
                basename "$FILE" \
                  | cut -d '.' -f1 \
                  | grep -io "\($WRT_TARGET\).*"
              )

              [ -n "$NAME" ] || continue

              NEW_FILE="$NAME-$WRT_INFO-$WRT_BRANCH-$WRT_WIFI-$WRT_DATE.$EXT"

              mv -f \
                "$FILE" \
                "./upload/$NEW_FILE"

            done < <(
              find ./bin/targets/ \
                -type f \
                -iname "*$WRT_TARGET*"
            )

            find ./bin/targets/ \
              -type f \
              -exec mv -f {} ./upload/ \;

          fi

          echo
          echo "===== 最终上传文件 ====="
          ls -lh ./upload/
          echo "========================"

      # ============================================================
      # Release
      #
      # 注意：
      # 前面的 5 KO 检查只要失败，这一步不会运行。
      # ============================================================
      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}-${{ env.WRT_BRANCH }}-${{ env.WRT_DATE }}

          files: ./wrt/upload/*.*

          body: |
            源码：${{ env.WRT_REPO }}
            分支：${{ env.WRT_BRANCH }}
            提交：${{ env.WRT_HASH }}
            配置：${{ env.WRT_CONFIG }}

            平台：${{ env.WRT_TARGET }}

            登录地址：${{ env.WRT_IP }}
            登录密码：${{ env.WRT_PW }}

            WIFI名称：${{ env.WRT_SSID }}
            WIFI密码：${{ env.WRT_WORD }}

            内核版本：${{ env.WRT_KVER }}

            插件列表：${{ env.WRT_LIST }}
