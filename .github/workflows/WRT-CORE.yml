#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@main
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          # 追加自定义feeds（顺序与本地一致，不要调换）
          # qmodem：只为 luci-app-mt5700m 提供 ubus-at-daemon 与 sms-tool_q 两个依赖，
          #         luci-app-qmodem 主包在 Config 里是 =n，不要打开——它的
          #         /etc/board.d/03_qmodem 会再建一个指向 eth2 的 USB 接口，
          #         和 mt5700m 建的 MT5700M 接口同 MAC，导致两条默认路由 + 两个 DHCP
          # mt5700m：FAN789/luci-app-mt5700m 是嵌套结构，可以直接当 feed 用；
          #          luci-app-h5000m-fancontrol 是平级结构（Makefile 在仓库根目录），
          #          当 feed 会报 target pattern contains no '%'，只能 clone 到
          #          package/ 下，见 Scripts/Packages.sh
          echo "" >> feeds.conf.default
          cat >> feeds.conf.default <<-EOF
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages;main
          src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall;main
          src-git mosdns https://github.com/sbwml/luci-app-mosdns;v5
          src-git helloworld https://github.com/fw876/helloworld
          src-git openclash https://github.com/vernesong/OpenClash;master
          src-git istore https://github.com/linkease/istore;main
          src-git qmodem https://github.com/FUjr/QModem;main
          src-git mt5700m https://github.com/FAN789/luci-app-mt5700m;main
          EOF

          echo "===== feeds.conf.default ====="
          cat feeds.conf.default
          echo "============================="

          ./scripts/feeds update -a

          # ---------------------------------------------------------------
          # 替换 golang 为 sbwml 的 26.x（Go 1.26.x）
          # xray-core 26.7.28 的 go.mod 写死 go 1.26，用 25.x 会报
          #   go: ../../go.mod requires go >= 1.26 (running go 1.25.14)
          # 且 OpenWrt 设了 GOTOOLCHAIN=local，Go 不会自动下载新版工具链
          # xray-core / sing-box / hysteria / naiveproxy 这些都是 Go 写的，
          # feed 自带的 golang 版本偏低会编不过或编出问题
          # 必须在 feeds update -a 之后、feeds install -a 之前做
          # ---------------------------------------------------------------
          rm -rf ./feeds/packages/lang/golang
          git clone --depth=1 --single-branch --branch 26.x \
            https://github.com/sbwml/packages_lang_golang ./feeds/packages/lang/golang
          echo "golang -> $(grep -m1 -oP '^GO_VERSION_MAJOR_MINOR:=\K.*' ./feeds/packages/lang/golang/golang/Makefile).$(grep -m1 -oP '^GO_VERSION_PATCH:=\K.*' ./feeds/packages/lang/golang/golang/Makefile)"

          # ---------------------------------------------------------------
          # 删除源码树自带 feeds 里的同名包，让自定义 feeds 的新版生效
          # 规则：feeds.conf.default 里排在前面的 feed 赢，
          #       ImmortalWrt 自带的 packages / luci 排在最前，不删就永远用旧版
          # ---------------------------------------------------------------

          # LuCI 界面包（imm 的 luci feed 里没有 ssr-plus / mosdns / store，无需处理）
          # 注意：argon 主题与 argon-config 不删！
          #   jerrykuku 官方 master(2.4.7) 跟这棵闭源 SDK 树有冲突，
          #   改用 imm luci feed 自带的 2.4.3-20250722（针对 24.10 适配过）
          rm -rf ./feeds/luci/applications/luci-app-openclash
          rm -rf ./feeds/luci/applications/luci-app-passwall
          rm -rf ./feeds/luci/applications/luci-app-passwall2
          rm -rf ./feeds/luci/applications/luci-app-mosdns
          rm -rf ./feeds/luci/applications/luci-app-ssr-plus

          # 代理内核与插件（imm 的 packages feed 重名很多，必须逐个让位）
          for P in xray-core xray-plugin sing-box hysteria naiveproxy \
                   shadowsocks-rust simple-obfs shadow-tls \
                   v2ray-plugin v2ray-core v2ray-geodata ipt2socks \
                   chinadns-ng dns2socks dnsproxy geoview microsocks tcping \
                   mosdns redsocks2 tuic-client ; do
            rm -rf "./feeds/packages/net/$P"
          done

          # 注：shadowsocksr-libev / dns2socks-rust / geo2txt 在 imm feed 里没有，
          #     本来就走 passwall_packages / helloworld / mosdns，无需删除
          #     trojan / kcptun / haproxy 只有 imm 自带一份，无更新版可换，保留

          # 关键：删完必须重建索引，否则被删的包仍在索引里，会留下断链
          ./scripts/feeds update -i

          ./scripts/feeds install -a

          # 清理断链的符号链接
          find ./package/feeds/ -xtype l -exec rm -f {} + 2>/dev/null || true

          # ---------------------------------------------------------------
          # 校验：打印每个关键组件最终来自哪个 feed、什么版本
          # 只要有一行显示 feeds/packages（即 lede 自带），就说明该包没换成新版
          # ---------------------------------------------------------------
          # 纯打印用，任何一条命令失败都不该让整个步骤挂掉
          set +e
          echo "===== 关键组件来源核对 ====="
          printf "%-24s %-22s %s\n" "包名" "来源feed" "版本"
          for PKG in xray-core xray-plugin sing-box hysteria naiveproxy \
                     shadowsocks-rust shadowsocksr-libev simple-obfs shadow-tls \
                     v2ray-plugin v2ray-geodata ipt2socks chinadns-ng dns2socks \
                     dns2socks-rust dnsproxy geoview microsocks tcping mosdns \
                     redsocks2 tuic-client trojan kcptun haproxy \
                     luci-app-passwall luci-app-ssr-plus luci-app-openclash \
                     luci-app-mosdns luci-app-store ; do
            LINK=$(find ./package/feeds/ -maxdepth 2 -name "$PKG" -print -quit 2>/dev/null)
            if [ -n "$LINK" ]; then
              # package/feeds/<feed名>/<包名>，上一级目录名就是 feed 名
              FEED=$(basename "$(dirname "$LINK")")
              MK=$(readlink -f "$LINK")/Makefile
              VER=$(grep -m1 -oP '^PKG_VERSION:=\K.*' "$MK" 2>/dev/null)
              [ -n "$VER" ] || VER=$(grep -m1 -oP '^PKG_SOURCE_DATE:=\K.*' "$MK" 2>/dev/null)
              [ -n "$VER" ] || VER=$(grep -m1 -oP '^PKG_SOURCE_VERSION:=\K.{0,12}' "$MK" 2>/dev/null)
              printf "%-24s %-22s %s\n" "$PKG" "$FEED" "${VER:-?}"
            else
              printf "%-24s %-22s %s\n" "$PKG" "未安装" "-"
            fi
          done
          echo "==========================="
          set -e

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Files
        run: |
          if [ -d "$GITHUB_WORKSPACE/Files" ]; then
            mkdir -p ./wrt/files
            cp -rf $GITHUB_WORKSPACE/Files/. ./wrt/files/
            # 只对 uci-defaults 做换行符转换
            # files/ 里还有 OpenClash 内核和 Geo 数据等二进制，dos2unix 会损坏它们
            find ./wrt/files/etc/uci-defaults/ -type f -exec dos2unix {} \; 2>/dev/null || true
            find ./wrt/files/etc/uci-defaults/ -type f -exec chmod +x {} \; 2>/dev/null || true
            chmod 755 ./wrt/files/etc/openclash/core/clash_meta 2>/dev/null || true

            echo "===== files ====="
            find ./wrt/files/ -type f
            echo "================="
          fi

      - name: Custom Settings
        run: |
          cd ./wrt/

          # ---------------------------------------------------------------
          # 机型 base 配置
          # padavanonly Discussion #433：
          #   kmod-mt_wifi7 依赖 PACKAGE_blkid，而 defconfig/mt7987_mt7992.config
          #   里写的是 "# CONFIG_PACKAGE_blkid is not set"。
          #   make defconfig 重算依赖时会连锁取消 kmod-mt_wifi7 / mt_hwifi /
          #   mt7992 / mt799a 以及一整片 MTK_WIFI7_* 参数，而且全程不报错，
          #   编出来的固件没有无线。
          # 正确流程是：cp base 配置 → 补 blkid=y → 再 defconfig。
          #
          # 这份 base 本身就是 H5000M 专用的（DEVICE_hiveton-h5000m=y、
          # 单机型、非 MULTI_PROFILE），先铺它再叠 Config/$WRT_CONFIG.txt，
          # 后写的行覆盖先写的，插件选择以我们的 Config 为准；
          # 上游新增的 MTK 参数则能拿到厂商给的默认值，不会掉进 Kconfig 默认。
          # ---------------------------------------------------------------
          WRT_BASE="./defconfig/mt7987_mt7992.config"
          if [ -f "$WRT_BASE" ]; then
            cp -f "$WRT_BASE" .config
            echo "base config: $WRT_BASE ($(grep -c . "$WRT_BASE") 行)"
          else
            echo "::warning::未找到 $WRT_BASE，跳过 base 配置"
            : > .config
          fi

          cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          # blkid 必须是最后一句，前面任何一处写成 "is not set" 都会前功尽弃
          sed -i '/^CONFIG_PACKAGE_blkid=/d; /^# CONFIG_PACKAGE_blkid is not set$/d' .config
          echo 'CONFIG_PACKAGE_blkid=y' >> .config

          make defconfig -j$(nproc)

      - name: Check WiFi Config
        run: |
          cd ./wrt/

          # defconfig 之后逐项核对：这些掉了就是没无线 / 插件被静默丢弃，
          # 与其编三小时出一个废固件，不如现在就停。
          WRT_MISS=0

          wrt_need() {
            if grep -qx "$1" ./.config; then
              printf "  [ OK ] %s\n" "$1"
            else
              printf "  [FAIL] %s   实际：%s\n" "$1" "$(grep -m1 -E "^#? ?${1%%=*}[= ]" ./.config || echo '未出现')"
              WRT_MISS=$((WRT_MISS+1))
            fi
          }

          echo "===== 无线（Discussion #433 相关）====="
          wrt_need "CONFIG_PACKAGE_blkid=y"
          for K in kmod-mt_wifi7 kmod-mt_wifi_cmn kmod-mt_hwifi kmod-mtk_pci \
                   kmod-mt7992 kmod-mt799a kmod-connac_if kmod-warp kmod-mtk_wed ; do
            wrt_need "CONFIG_PACKAGE_$K=y"
          done
          wrt_need "CONFIG_MTK_WIFI7_FIRST_IF_MT7992=y"
          wrt_need "CONFIG_MTK_WIFI7_SECOND_IF_MT7992=y"
          wrt_need "CONFIG_MTK_WIFI7_MT_WIFI=m"
          wrt_need "CONFIG_MTK_WIFI7_FIRST_IF_EEPROM_FLASH=y"
          wrt_need "CONFIG_MTK_WIFI7_FIRST_IF_IPAILNA=y"
          wrt_need "CONFIG_MTK_WIFI7_SECOND_IF_IPAILNA=y"
          wrt_need "CONFIG_MTK_WIFI7_SKU_TYPE=\"BE5040\""
          wrt_need "CONFIG_MTK_HWIFI_MT7992=y"
          wrt_need "CONFIG_MTK_HWIFI_MT799A=y"
          wrt_need "CONFIG_MTK_HWIFI_MT7992_RRO_MODE=4"

          echo "===== 机型 ====="
          wrt_need "CONFIG_TARGET_mediatek_filogic_DEVICE_hiveton-h5000m=y"

          echo "===== 插件 ====="
          for P in luci-app-passwall luci-app-ssr-plus luci-app-openclash \
                   luci-app-mosdns luci-app-mt5700m luci-app-h5000m-fancontrol \
                   luci-app-mtwifi-cfg luci-app-store luci-theme-argon ; do
            wrt_need "CONFIG_PACKAGE_$P=y"
          done

          echo "========================================"
          if [ "$WRT_MISS" -gt 0 ]; then
            echo "::error::defconfig 后有 $WRT_MISS 项没保住"
            if [ "$WRT_TEST" = 'true' ]; then
              echo "TEST 模式，不中断，配置文件仍会上传供核对"
            else
              exit 1
            fi
          else
            echo "全部保住，继续编译"
          fi

      - name: Clean Build Dir
        run: |
          cd ./wrt/

          make clean -j$(nproc)

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          # 先把 dl 库下全，失败的再单线程补一遍
          # timeout 是必须的：某个源站 TCP 连着但不给数据时，make download
          # 会一直吊着不返回，|| 永远触发不了。25 分钟没下完就强制中断，
          # 转单线程重试，单线程会打出正在下哪个 URL，方便定位
          timeout 1500 make download -j$(nproc) || make download -j1 V=s

          echo "===== dl 目录 ====="
          du -sh ./dl
          # 清掉下了一半的空文件，避免编译时报校验错
          find ./dl -size -1024c -type f -exec ls -l {} \; -exec rm -f {} \;
          echo "==================="

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j$(nproc) V=s || make -j1 V=s

      - name: Cleanup Caches
        if: success() && env.WRT_TEST != 'true' && steps.check-cache.outputs.cache-hit != 'true'
        run: |
          CACHE_LIST=$(gh cache list --key "$WRT_CONFIG-$WRT_INFO" | cut -f 1)
          for CACHE_KEY in $CACHE_LIST; do
            gh cache delete $CACHE_KEY
          done

          echo "caches cleanup done!"

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir -p ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \; | sort -u | head -n1)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |


            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
