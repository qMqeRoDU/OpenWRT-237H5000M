# CI项目
name: H5000M

# CI计划
on:

  # 自动编译：每天北京时间凌晨3点（UTC 19:00）
  schedule:
    - cron: 0 19 * * *

  # 手动编译
  workflow_dispatch:
    inputs:

      PACKAGE:
        description: '手动追加插件包，多个请用\n符号隔开。'
        required: false
        type: string

      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

# CI权限
permissions: write-all

# 防止定时任务与手动触发撞车，同时跑两个 job 会抢缓存
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# CI任务
jobs:

  config:

    name: H5000M

    # 调用公用编译核心 WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml

    with:

      # 编译配置
      WRT_CONFIG: H5000M

      # 默认主题
      # 继续使用 Argon
      # Aurora 同时编进固件，之后可以手动切换
      WRT_THEME: argon

      # 默认主机名
      WRT_NAME: Hiveton_H5000M

      # 普通无线驱动的备用 SSID
      # H5000M 实际使用 MTK 闭源 mtwifi，
      # 2.4G / 5G 名称由 Settings.sh 单独设置
      WRT_SSID: Hiveton

      # 默认 WiFi 密码
      WRT_WORD: ljx2026@.

      # 默认 LAN 地址
      WRT_IP: 192.168.99.1

      # 默认登录密码
      # 当前脚本主要用于 Release 提示
      WRT_PW: admin

      # 237 闭源 MTK Wi-Fi7 驱动源码
      WRT_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git

      # 源码分支
      WRT_BRANCH: mt798x-mt799x-6.6-mtwifi

      # 源码名称
      WRT_SOURCE: padavanonly/immortalwrt-mt798x-6.6

      # 手动追加插件
      WRT_PACKAGE: ${{inputs.PACKAGE}}

      # TEST：只输出最终配置，不编译
      WRT_TEST: ${{inputs.TEST}}
