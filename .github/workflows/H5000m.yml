# CI项目
name: H5000M


# ============================================================
# CI 触发方式
# ============================================================

on:

  # 自动编译：
  # 每天北京时间凌晨 3 点
  # UTC 时间为前一天 19:00
  schedule:
    - cron: '0 19 * * *'

  # 手动编译
  workflow_dispatch:
    inputs:

      PACKAGE:
        description: '手动追加插件包，多个请用\n符号隔开。'
        required: false
        default: ''
        type: string

      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean


# ============================================================
# CI 权限
# ============================================================

permissions: write-all


# ============================================================
# 防止定时任务和手动任务同时运行抢缓存
# ============================================================

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false


# ============================================================
# CI 任务
# ============================================================

jobs:

  config:

    name: H5000M

    # 调用公用编译核心
    uses: ./.github/workflows/WRT-CORE.yml

    with:

      # ======================================================
      # 编译配置
      # 对应 Config/H5000M.txt
      # ======================================================

      WRT_CONFIG: H5000M


      # ======================================================
      # 默认主题
      # ======================================================

      WRT_THEME: argon


      # ======================================================
      # 默认主机名
      # ======================================================

      WRT_NAME: Hiveton_H5000M


      # ======================================================
      # 默认 WIFI 名称
      #
      # H5000M 使用 MTK 闭源 mtwifi 驱动。
      # 实际 2.4G / 5G 名称由 Settings.sh 处理。
      # ======================================================

      WRT_SSID: ImmortalWrt


      # ======================================================
      # 默认 WIFI 密码
      # ======================================================

      WRT_WORD: ljx2026@.


      # ======================================================
      # 默认 LAN 地址
      # ======================================================

      WRT_IP: 192.168.99.1


      # ======================================================
      # 默认 root 密码
      # ======================================================

      WRT_PW: admin


      # ======================================================
      # 237 闭源 MTK Wi-Fi 7 源码
      # ======================================================

      WRT_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git


      # ======================================================
      # 源码分支
      # ======================================================

      WRT_BRANCH: mt798x-mt799x-6.6-mtwifi


      # ======================================================
      # 源码名称
      # ======================================================

      WRT_SOURCE: padavanonly/immortalwrt-mt798x-6.6


      # ======================================================
      # 手动追加插件
      #
      # workflow_dispatch：
      #   有内容 -> 传用户填写内容
      #   没内容 -> 传一行合法的 .config 注释
      #
      # schedule：
      #   没有 inputs.PACKAGE
      #   因此直接传合法注释
      #
      # 这样绝不会把空值 '' 传给 reusable workflow。
      # ======================================================

      WRT_PACKAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.PACKAGE || '# no extra package' }}


      # ======================================================
      # TEST 模式
      #
      # 手动运行：
      #   勾选 TEST -> "true"
      #   不勾选    -> "false"
      #
      # 自动定时：
      #   永远 -> "false"
      #
      # WRT-CORE 当前把 WRT_TEST 定义成 string，
      # 所以这里明确转换为字符串，
      # 避免 schedule 时出现空字符串 ''。
      # ======================================================

      WRT_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.TEST && 'true' || 'false' }}
